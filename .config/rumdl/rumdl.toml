# rumdl: personal Markdown lint defaults (https://github.com/rvben/rumdl).
#
# Found automatically by rumdl when a file's repo has no .rumdl.toml or
# .markdownlint.* of its own (XDG_CONFIG_HOME/rumdl/rumdl.toml). Consumers:
# the guards plugin's lint-markdown hook (Claude Code) and Neovim via nvim-lint.
# Project-level config always wins over this file.

[global]
# Line length: prose wraps in the editor, not the file.
# MD032 (blank line before a list) and MD034 (bare URL): cosmetic, two thirds of
# all lint nags in a 30-day transcript sample and ignored nine times in ten
# (guards review, 2026-11-06). Re-measure after a month.
disable = ["MD013", "MD032", "MD034"]
