onboarding = false

[ui.toast]
delivery = "herdr"

[ui]
# Hold this modifier + right-click to send the right-click to the focused pane
# app (nvim, lazygit, etc.) instead of opening herdr's pane menu. Bare
# right-click still opens the menu. Shift is unsupported (terminals reserve it).
right_click_passthrough_modifier = "cmd"
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"

[experimental]
pane_history = true

[update]
channel = "stable"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"
